<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <title>Heart Disease Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
            background: linear-gradient(135deg, #1a1a4f, #0a0e23);
            position: relative;
        }
        
        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        
        .heart {
            width: 60vw;
            height: 60vw;
            max-width: 700px;
            max-height: 700px;
            background: rgba(255, 8, 68, 0.05);
            border-radius: 50% 50% 0 0 / 60% 60% 0 0;
            transform: rotate(45deg);
            position: relative;
            box-shadow: 0 0 40px rgba(255, 8, 68, 0.2);
            animation: heart-beat 2s ease-in-out infinite, heart-hover 6s ease-in-out infinite;
        }
        
        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 8, 68, 0.05);
            box-shadow: 0 0 40px rgba(255, 8, 68, 0.2);
        }
        
        .heart::before {
            left: -50%;
            top: 0;
        }
        
        .heart::after {
            top: -50%;
            left: 0;
        }
        
        @keyframes heart-beat {
            0%, 100% { transform: rotate(45deg) scale(1); }
            30% { transform: rotate(45deg) scale(1.1); }
            60% { transform: rotate(45deg) scale(1); }
            90% { transform: rotate(45deg) scale(1.05); }
        }
        
        @keyframes heart-hover {
            0%, 100% { transform: rotate(45deg) translate(0, 0); }
            25% { transform: rotate(45deg) translate(-10px, -10px); }
            50% { transform: rotate(45deg) translate(0, -20px); }
            75% { transform: rotate(45deg) translate(10px, -10px); }
        }
        
        .card {
            border: none;
            border-radius: 20px;
            background: rgba(26, 26, 79, 0.6);
            backdrop-filter: blur(10px);
            color: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            min-width: 1000px;
            padding: 2rem !important;
        }
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        
        h2 {
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #ff0844, #ffb199);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative;
            margin: 0;
            padding: 0;
            text-align: center;
            white-space: nowrap;
        }

        .title-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .form-control {
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 15px 25px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 400px;
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 25px rgba(255, 8, 68, 0.4);
            border-color: rgba(255, 8, 68, 0.5);
            transform: translateY(-2px);
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #ff0844, #ff3366);
            border: none;
            border-radius: 50px;
            padding: 15px 50px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 20px rgba(255, 8, 68, 0.3);
            position: relative;
            overflow: hidden;
            font-size: 1.1rem;
        }
        
        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 8, 68, 0.4);
        }
        
        .heartbeat-icon {
            display: inline-block;
            color: #ff0844;
            margin: 0 5px;
            animation: iconPulse 1.2s ease-in-out infinite;
            vertical-align: middle;
        }
        
        @keyframes iconPulse {
            0% { transform: scale(1); }
            30% { transform: scale(1.3); }
            60% { transform: scale(1); }
        }
        
        #result {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            transition: all 0.5s ease;
            transform: translateY(20px);
            opacity: 0;
            height: 0;
            overflow: hidden;
        }
        
        #result.active {
            transform: translateY(0);
            opacity: 1;
            height: auto;
            margin-bottom: 20px;
        }

        #result .stat-card:first-child {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.15);
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            height: fit-content;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-value {
            color: #fff;
            margin-bottom: 10px;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="heart-bg">
        <div class="heart"></div>
    </div>
    
    <div class="container">
        <div class="card">
            <div class="title-container">
                <h2>Heart Disease Prediction <i class="fas fa-heart heartbeat-icon"></i></h2>
            </div>
            
            <div class="text-center mb-4">
                <p class="lead">Enter a patient ID to get a heart disease risk assessment</p>
            </div>
            
            <div class="d-flex justify-content-center">
                <div class="input-group" style="max-width: 400px;">
                    <input type="text" class="form-control" id="patientId" placeholder="Enter Patient ID">
                    <button class="btn btn-primary" onclick="predict()">Predict</button>
                </div>
            </div>
            
            <div id="result"></div>
        </div>
    </div>

    <script>
        function predict() {
            const patientId = document.getElementById('patientId').value;
            if (!patientId) {
                alert('Please enter a patient ID');
                return;
            }

            // Show loading state
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="text-center"><i class="fas fa-spinner fa-spin fa-3x"></i></div>';
            resultDiv.classList.add('active');

            // Make API call to your backend
            fetch('https://heart-disease-prediction.onrender.com/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ patient_id: patientId }),
            })
            .then(response => response.json())
            .then(data => {
                displayResults(data);
            })
            .catch(error => {
                console.error('Error:', error);
                resultDiv.innerHTML = '<div class="text-center text-danger">Error: Could not get prediction results</div>';
            });
        }

        function displayResults(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="stat-card">
                    <h3>Risk Assessment</h3>
                    <div class="stat-value">
                        <span>Risk Level:</span>
                        <span>${data.risk_assessment.risk_level}</span>
                    </div>
                    <div class="stat-value">
                        <span>Risk Score:</span>
                        <span>${data.risk_assessment.risk_score}</span>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>Patient Demographics</h3>
                    <div class="stat-value">
                        <span>Age:</span>
                        <span>${data.vital_statistics.Patient_Demographics.Age}</span>
                    </div>
                    <div class="stat-value">
                        <span>Sex:</span>
                        <span>${data.vital_statistics.Patient_Demographics.Sex}</span>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>Cardiovascular Metrics</h3>
                    <div class="stat-value">
                        <span>Murmur Present:</span>
                        <span>${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Presence ? 'Yes' : 'No'}</span>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>Recommendations</h3>
                    <ul>
                        ${data.detailed_analysis.lifestyle_recommendations.map(rec => `<li>${rec}</li>`).join('')}
                    </ul>
                </div>
            `;
        }
    </script>
</body>
</html>
