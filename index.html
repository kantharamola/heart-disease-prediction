<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Heart Disease Prediction</title>
    <style>
        :root {
            --primary-bg: #1a1a2e;
            --card-bg: rgba(28, 28, 51, 0.8);
            --accent-color: #ff1654;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .app-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .app-title {
            color: var(--accent-color);
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .input-section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--card-border);
        }

        .input-container {
            max-width: 400px;
            margin: 0 auto;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(255, 22, 84, 0.2);
            color: var(--text-primary);
        }

        .form-control::placeholder {
            color: var(--text-secondary);
        }

        .btn-predict {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-predict:hover {
            background: #ff2e6a;
            transform: translateY(-2px);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .metric-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            border: 1px solid var(--card-border);
        }

        .metric-card h3 {
            color: var(--accent-color);
            font-size: 1.2rem;
            margin-bottom: 1rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .metric-label {
            color: var(--text-secondary);
        }

        .metric-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .risk-level {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .risk-score {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .murmur-section h4 {
            color: var(--text-secondary);
            font-size: 1rem;
            margin: 1.5rem 0 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .app-title {
                font-size: 2rem;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .metric-card {
                padding: 1rem;
            }

            .risk-level {
                font-size: 1.2rem;
            }

            .risk-score {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1 class="app-title">
                <i class="fas fa-heartbeat"></i>
                Heart Disease Prediction
            </h1>
        </header>

        <section class="input-section">
            <div class="input-container">
                <div class="mb-3">
                    <label for="patientId" class="form-label">Enter Patient ID:</label>
                    <input type="text" class="form-control" id="patientId" placeholder="Enter Patient ID">
                </div>
                <button class="btn btn-predict" onclick="predict()">Get Advice</button>
            </div>
        </section>

        <div id="result" class="results-grid" style="display: none;"></div>
    </div>

    <script>
        function predict() {
            const patientId = document.getElementById('patientId').value;
            if (!patientId) {
                alert('Please enter a patient ID');
                return;
            }

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'grid';
            resultDiv.innerHTML = '<div class="metric-card text-center"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';

            fetch('https://heart-disease-prediction-api.onrender.com/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'Origin': 'https://kantharamola.github.io'
                },
                mode: 'cors',
                body: JSON.stringify({ patient_id: patientId }),
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                displayResults(data);
            })
            .catch(error => {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <div class="metric-card text-center text-danger">
                        <h3>Error</h3>
                        <p>Could not get prediction results.</p>
                        <p>Details: ${error.message}</p>
                        <p class="mt-3">Please make sure:</p>
                        <ul class="text-start">
                            <li>The patient ID exists in the database</li>
                            <li>The API server is running</li>
                            <li>Your internet connection is stable</li>
                        </ul>
                    </div>`;
            });
        }

        function displayResults(data) {
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = `
                <div class="metric-card">
                    <h3>Risk Assessment</h3>
                    <div class="risk-level">${data.risk_assessment.risk_level}</div>
                    <div class="risk-score">(${(data.risk_assessment.risk_score * 100).toFixed(1)}%)</div>
                    <p class="mt-3">${data.risk_assessment.interpretation}</p>
                </div>

                <div class="metric-card">
                    <h3>Cardiovascular Metrics</h3>
                    <div class="murmur-section">
                        <h4>Murmur Assessment</h4>
                        <div class="metric-row">
                            <span class="metric-label">Presence:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Presence ? 'Present' : 'Absent'}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Location:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Location}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Most Audible:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Most_Audible_Location}</span>
                        </div>
                    </div>

                    <div class="murmur-section">
                        <h4>Diastolic Details</h4>
                        <div class="metric-row">
                            <span class="metric-label">Grade:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Diastolic_Details.Grade}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Pitch:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Diastolic_Details.Pitch}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Quality:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Diastolic_Details.Quality}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Shape:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Diastolic_Details.Shape}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Timing:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Diastolic_Details.Timing}</span>
                        </div>
                    </div>

                    <div class="murmur-section">
                        <h4>Systolic Details</h4>
                        <div class="metric-row">
                            <span class="metric-label">Grade:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Systolic_Details.Grade}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Pitch:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Systolic_Details.Pitch}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Quality:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Systolic_Details.Quality}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Shape:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Systolic_Details.Shape}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Timing:</span>
                            <span class="metric-value">${data.vital_statistics.Cardiovascular_Metrics.Murmur_Assessment.Systolic_Details.Timing}</span>
                        </div>
                    </div>
                </div>

                <div class="metric-card">
                    <h3>Patient Demographics</h3>
                    <div class="metric-row">
                        <span class="metric-label">Age:</span>
                        <span class="metric-value">${data.vital_statistics.Patient_Demographics.Age}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Height:</span>
                        <span class="metric-value">${data.vital_statistics.Patient_Demographics.Height} cm</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Weight:</span>
                        <span class="metric-value">${data.vital_statistics.Patient_Demographics.Weight} kg</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Sex:</span>
                        <span class="metric-value">${data.vital_statistics.Patient_Demographics.Sex}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Pregnancy Status:</span>
                        <span class="metric-value">${data.vital_statistics.Patient_Demographics.Pregnancy_Status}</span>
                    </div>
                </div>

                <div class="metric-card">
                    <h3>Risk Factors</h3>
                    <div class="metric-row">
                        ${data.detailed_analysis.risk_factors.map(factor => `<div class="metric-value">${factor}</div>`).join('')}
                    </div>
                </div>

                <div class="metric-card">
                    <h3>Recommendations</h3>
                    <div class="metric-row">
                        ${data.detailed_analysis.lifestyle_recommendations.map(rec => `<div class="metric-value">${rec}</div>`).join('')}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
